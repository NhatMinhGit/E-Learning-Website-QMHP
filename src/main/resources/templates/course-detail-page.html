<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 80px;
        }

        .course-card img {
            height: 150px;
            object-fit: cover;
        }

        .navbar-center-title {
            font-weight: bold;
            font-size: 20px;
            color: white;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3 fixed-top">
    <div class="container d-flex align-items-center justify-content-between">

        <form class="d-flex" th:action="@{/courses-list/search}" method="get" role="search">
            <input class="form-control me-2" type="search" name="search" placeholder="Tìm kiếm..." aria-label="Search">
            <button class="btn btn-outline-light" type="submit">Tìm</button>
        </form>

        <div class="d-none d-lg-flex justify-content-center flex-grow-1">
            <div class="navbar-center-title">QHMP E-Learning</div>
        </div>

        <div class="d-flex">
            <a th:href="@{/login}" class="btn btn-outline-light me-2">Đăng nhập</a>
            <a th:href="@{/register}" class="btn btn-success">Đăng ký</a>
        </div>
    </div>
</nav>

<div class="container my-5">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/courses-list}">Danh sách khóa học</a></li>
            <li class="breadcrumb-item active" aria-current="page">Chi tiết khóa học</li>
        </ol>
    </nav>

    <div class="card-body">
        <div class="text-center mb-4">
            <img th:src="'https://placehold.co/600x400?text=' + ${courses.title}" class="course-detail-img" alt="Lỗi hình ảnh">
        </div>

        <h1 class="card-title text-center mb-4" th:text="${courses.title}"></h1>

        <div class="row mb-4">
            <div class="col-md-6">
                <h5 class="text-primary">Thông tin khóa học</h5>
                <p class="card-text" th:text="${courses.description}"></p>
            </div>
            <div class="col-md-6">
                <div class="card h-100 bg-light">
                    <div class="card-body">
                        <h5 class="card-title">Đăng ký khóa học</h5>
                        <p><strong>Số học viên đã đăng ký:</strong> <span th:text="${courses.enrollments.size()}"></span></p>
                        <p><strong>Giá:</strong> <span th:text="${#numbers.formatDecimal(courses.price, 0, 'COMMA', '.', '₫')}"></span></p>
                        <a th:href="/" class="btn btn-success w-100">Đăng ký khóa học</a>
<!--                        Chức năng add to cart-->

                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-center gap-2">
            <a th:href="@{/courses-list}" class="btn btn-secondary">Trở lại trang chính</a>
        </div>
    </div>
</div>
</body>
</html>
