<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chỉnh sửa khoá học</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 80px;
        }

        .course-card img {
            height: 150px;
            object-fit: cover;
        }

        .navbar-center-title {
            font-weight: bold;
            font-size: 20px;
            color: white;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3 fixed-top">
    <div class="container d-flex align-items-center justify-content-between">

        <form class="d-flex" th:action="@{/courses-list/search}" method="get" role="search">
            <input class="form-control me-2" type="search" name="search" placeholder="Tìm kiếm..." aria-label="Search">
            <button class="btn btn-outline-light" type="submit">Tìm</button>
        </form>

        <div class="d-none d-lg-flex justify-content-center flex-grow-1">
            <div class="navbar-center-title">QHMP E-Learning</div>
        </div>

        <div class="d-flex">
            <a th:href="@{/login}" class="btn btn-outline-light me-2">Đăng nhập</a>
            <a th:href="@{/register}" class="btn btn-success">Đăng ký</a>
        </div>
    </div>
</nav>
<div class="container my-5">

</div>
</body>
</html>
