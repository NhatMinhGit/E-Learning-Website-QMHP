<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm khoá học mới</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 80px;
        }

        .course-card img {
            height: 150px;
            object-fit: cover;
        }

        .navbar-center-title {
            font-weight: bold;
            font-size: 20px;
            color: white;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3 fixed-top">
    <div class="container d-flex align-items-center justify-content-between">

        <form class="d-flex" th:action="@{/courses-list/search}" method="get" role="search">
            <input class="form-control me-2" type="search" name="search" placeholder="Tìm kiếm..." aria-label="Search">
            <button class="btn btn-outline-light" type="submit">Tìm</button>
        </form>

        <div class="d-none d-lg-flex justify-content-center flex-grow-1">
            <div class="navbar-center-title">QHMP E-Learning</div>
        </div>

        <div class="d-flex">
            <a th:href="@{/login}" class="btn btn-outline-light me-2">Đăng nhập</a>
            <a th:href="@{/register}" class="btn btn-success">Đăng ký</a>
        </div>
    </div>
</nav>
<div class="container my-5">


    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/courses-list}">Danh sách khóa học</a></li>
            <li class="breadcrumb-item active" aria-current="page">Thêm khóa học mới</li>
        </ol>
    </nav>
    <div class="form-container">
        <h2 class="text-center mb-4">Thêm khóa học mới</h2>

        <form th:action="@{/add-course}" th:object="${coursesDto}" method="post">
            <div class="mb-3">
                <label class="form-label">Tiêu đề khóa học</label>
                <input type="text" class="form-control" th:field="*{title}" placeholder="Nhập tiêu đề khóa học">
                <div class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Mô tả khóa học</label>
                <textarea class="form-control" th:field="*{description}" rows="4"
                          placeholder="Nhập mô tả chi tiết về khóa học"></textarea>
                <div class="text-danger" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Giá khóa học</label>
                <input type="text" class="form-control" th:field="*{price}" placeholder="Ví dụ: 1.200.000 VND">
                <div class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
            </div>

<!--            Thêm mới các bài học cụ thể ở đây của Quân-->

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-lg">Thêm khóa học</button>
                <a th:href="@{/courses-list}" class="btn btn-outline-secondary">Hủy</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
